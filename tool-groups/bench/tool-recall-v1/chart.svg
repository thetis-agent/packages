<title id="t">@thetis/tool-groups on tool-recall@1</title>
<desc id="d">Grouped bars, one group per compared metric (bytes_system, bytes_tools, bytes_turn1, bytes_last, tools_n, steps_n, non_ascii_ratio, direct_n, route_recall, route_precision, route_f1, routed_nothing, surface_tools) and one bar per arm (none, thetis-tool-groups, thetis-tool-groups-lexical, thetis-tool-groups-fusion), each metric scaled to the largest mean in its column. thetis-tool-groups is this package; none is the floor.</desc>
