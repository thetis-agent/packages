<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="csp-nonce" content="{{nonce}}">
<title>Thetis</title>
<base href="{{base}}/">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app">

  <aside id="sidebar" class="sidebar">
    <header class="sidebar-head">
      <button id="menu" class="menu-btn" title="Menu" aria-label="Menu" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M4 6h12M4 10h12M4 14h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">Thetis</span>
      </button>
      <button id="new-chat" class="icon-btn" title="New conversation" aria-label="New conversation">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div id="sidebar-head" class="sidebar-slot"></div>

    <div class="sidebar-search">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="8.5" cy="8.5" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12.5 12.5 16.5 16.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input id="session-search" type="text" placeholder="Search conversations" aria-label="Search conversations" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>

    <nav id="session-list" class="session-list" aria-label="Conversations"></nav>

    <footer class="sidebar-foot">
      <div class="foot-row foot-identity">
        <!-- The face is the control that changes it: a real button, so the keyboard and a screen reader
             reach it the way the mouse does. The file input is the browser's own chooser, kept out of the
             layout and opened by that button; `accept` only narrows what the chooser offers, and the
             server decides what a file really is from its bytes. The × appears once there is a picture:
             an avatar you cannot take off again from where you put it on is only half a feature. -->
        <button type="button" id="user-face" class="foot-face" title="Change your avatar" aria-label="Change your avatar"></button>
        <button type="button" id="user-face-clear" class="quiet-link foot-face-clear" title="Remove your avatar" aria-label="Remove your avatar" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M6 6l8 8M14 6l-8 8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
        </button>
        <input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        <span id="user-name" class="foot-name" title="Signed in as"></span>
        <span id="status" class="status is-offline">connecting</span>
      </div>
      <div class="foot-row foot-actions">
        <form id="logout" method="post" action="/logout">
          <button type="submit" class="quiet-link foot-action" title="Sign out of this account on this browser">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M8 4H4.5v12H8M12 6.5 15.5 10 12 13.5M15 10H7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Log out</span>
          </button>
        </form>
      </div>
    </footer>
  </aside>

  <main class="main">
    <nav id="tabs" class="tabs" role="tablist" aria-label="Open conversations">
      <button id="toggle-sidebar" class="icon-btn sm chat-menu" title="Conversations" aria-label="Show conversations" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M4 6h12M4 10h12M4 14h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="new-tab" class="icon-btn sm" title="New conversation" aria-label="New conversation">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </nav>

    <div id="panes" class="panes"></div>

    <div class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-field">
          <textarea id="input" class="composer-input" rows="1" placeholder="Message Thetis…" aria-label="Message"></textarea>
        </div>
        <div class="composer-bar">
          <div class="composer-tools" id="composer-tools"></div>
          <span id="composer-note" class="composer-note"></span>
          <div class="composer-run">
            <button type="button" id="stop" class="stop-btn" title="Stop the running turn" hidden>
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="6" y="6" width="8" height="8" rx="1.5" fill="currentColor"/>
              </svg>
              <span>Stop</span>
            </button>
            <button id="send" type="submit" class="send-btn" title="Send" aria-label="Send">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M4 10h11M10.5 5.5 15 10l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </form>
      <p class="composer-hint">Enter to send · Shift+Enter for a newline</p>
    </div>

    <!-- The shelf: the bottom dock under the conversation, the legacy terminal drawer's chrome made
         generic. Inside .main rather than across the whole page, because what it shows belongs to the
         conversation — so it shortens the transcript and leaves the sidebar and the rail alone. The
         shell owns the grip, the title, collapse and hide; a package mounts into the body and may put
         its own buttons before collapse. Hidden until a shelf entry is opened; the height is animated
         and set by views/shelf.js, so nothing here fixes it. -->
    <div id="shelf" class="shelf" hidden aria-label="Shelf">
      <div class="shelf-grip" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>
      <header class="shelf-head">
        <span class="shelf-title"></span>
        <div class="shelf-actions">
          <button type="button" class="icon-btn sm shelf-collapse" title="Collapse to the title strip" aria-label="Collapse the shelf">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="icon-btn sm shelf-close" title="Hide the shelf — what is in it keeps running" aria-label="Hide the shelf">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6l8 8M14 6l-8 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>
      <div class="shelf-body"></div>
    </div>
  </main>

  <aside id="rail" class="rail" hidden>
    <nav id="rail-tabs" class="rail-tabs" aria-label="Panels"></nav>
  </aside>

  <section id="dock" class="dock" aria-label="Panel" hidden>
    <div class="panel-head">
      <div class="panel-head-text">
        <h2 class="panel-title"></h2>
        <span class="panel-sub"></span>
      </div>
      <div class="panel-actions"></div>
      <button type="button" class="icon-btn sm panel-close" title="Close (Esc)" aria-label="Close the panel">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5l-10 10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="panel-body"></div>
  </section>

  <section id="place" class="place" aria-label="Place" hidden>
    <div class="place-head">
      <button type="button" class="icon-btn sm chat-menu" title="Conversations" aria-label="Show conversations" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M4 6h12M4 10h12M4 14h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="place-head-text">
        <h1 class="place-title"></h1>
        <span class="place-sub"></span>
      </div>
      <button type="button" class="icon-btn place-close" title="Close (Esc)" aria-label="Close and return to the conversation">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5l-10 10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="place-body"></div>
  </section>

</div>
<footer id="statusbar" class="statusbar" hidden></footer>
<div id="sidebar-veil" class="sidebar-veil" hidden></div>
<script type="module" src="assets/app.js"></script>
</body>
</html>
