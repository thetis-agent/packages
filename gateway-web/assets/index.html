<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Thetis</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div id="app">

  <aside id="sidebar" class="sidebar">
    <header class="sidebar-head">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="16" cy="16" r="3" fill="currentColor"/>
        </svg>
        <span class="brand-name">Thetis</span>
      </div>
      <button id="new-chat" class="icon-btn" title="New conversation" aria-label="New conversation">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="sidebar-search">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="8.5" cy="8.5" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12.5 12.5 16.5 16.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input id="session-search" type="text" placeholder="Search conversations" aria-label="Search conversations" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>

    <nav id="session-list" class="session-list" aria-label="Conversations"></nav>

    <footer class="sidebar-foot">
      <div class="foot-row foot-identity">
        <span id="user-face" class="foot-face"></span>
        <span id="user-name" class="foot-name" title="Signed in as"></span>
        <span id="status" class="status is-offline">connecting</span>
      </div>
      <div class="foot-row foot-actions">
        <form id="logout" method="post" action="/logout">
          <button type="submit" class="quiet-link foot-action" title="Sign out of this account on this browser">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M8 4H4.5v12H8M12 6.5 15.5 10 12 13.5M15 10H7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Log out</span>
          </button>
        </form>
      </div>
    </footer>
  </aside>

  <main class="main">
    <div class="chat-bar">
      <button id="toggle-sidebar" class="icon-btn sm chat-menu" title="Conversations" aria-label="Show conversations" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M4 6h12M4 10h12M4 14h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <span id="chat-title" class="chat-sub"></span>
      <span class="chat-bar-gap"></span>
      <span id="chat-state" class="chat-state" hidden></span>
    </div>

    <div id="transcript" class="transcript" tabindex="0"></div>

    <div class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-field">
          <textarea id="input" class="composer-input" rows="1" placeholder="Message Thetis…" aria-label="Message"></textarea>
        </div>
        <div class="composer-bar">
          <span id="composer-note" class="composer-note"></span>
          <div class="composer-run">
            <button type="button" id="stop" class="stop-btn" title="Stop the running turn" hidden>
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="6" y="6" width="8" height="8" rx="1.5" fill="currentColor"/>
              </svg>
              <span>Stop</span>
            </button>
            <button id="send" type="submit" class="send-btn" title="Send" aria-label="Send">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M4 10h11M10.5 5.5 15 10l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </form>
      <p class="composer-hint">Enter to send · Shift+Enter for a newline</p>
    </div>
  </main>

</div>
<div id="sidebar-veil" class="sidebar-veil" hidden></div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
